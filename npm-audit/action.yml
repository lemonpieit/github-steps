name: NPM Audit with Slack
description: Run npm audit, notify Slack on medium+ issues, fail workflow

inputs:
  webhook:
    required: false
    description: Slack incoming webhook URL (optional — omit to skip Slack notification)

runs:
  using: composite
  steps:
    - name: Run npm audit (high+)
      id: audit
      continue-on-error: true
      shell: bash
      run: npm audit --audit-level=high

    - name: Notify Slack on failure
      if: steps.audit.outcome == 'failure' && inputs.webhook != ''
      uses: lemonpieit/github-steps/slack-notify@v1.0.7
      with:
        webhook: ${{ inputs.webhook }}
        title: "🚨 Security audit failed: High or higher vulnerabilities detected"

    - name: Fail workflow
      if: steps.audit.outcome == 'failure'
      shell: bash
      run: exit 1
